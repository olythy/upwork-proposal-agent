[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["store", "validation", "api", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
