name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and bootstrap data files
        run: make install

      - name: Lint (ruff check + format check)
        run: make lint

      - name: Test (pytest)
        run: make test
